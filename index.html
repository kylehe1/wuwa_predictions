<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WuWa Predictions</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="site-header">
    <div class="brand">
      <h1>WuWa Predictions</h1>
    </div>

    <div class="players">
      <span class="players-label">Players</span>
      <input id="player-0" class="player-input" maxlength="20" aria-label="Player 1 name">
      <span class="amp">&amp;</span>
      <input id="player-1" class="player-input" maxlength="20" aria-label="Player 2 name">
    </div>
  </header>

  <!-- Tabs (one per batch) are rendered here by app.js -->
  <nav id="tabs" class="tabs"></nav>

  <!-- The active batch is rendered here by app.js -->
  <main id="batch"></main>

  <!-- "New batch" popup: choose the image format -->
  <div id="chooser" class="modal" hidden>
    <div class="modal-box">
      <h2>New batch</h2>
      <p>Which image format are the teasers?</p>
      <div class="layout-options">
        <button class="layout-option" data-action="pick-layout" data-layout="vertical">
          <span class="preview-pair">
            <span class="preview preview-vertical"></span>
            <span class="preview preview-vertical"></span>
          </span>
          <strong>Vertical</strong>
          <small>260 : 480 · 2 per row</small>
        </button>
        <button class="layout-option" data-action="pick-layout" data-layout="horizontal">
          <span class="preview-pair">
            <span class="preview preview-horizontal"></span>
          </span>
          <strong>Horizontal</strong>
          <small>560 : 230 · 1 per row</small>
        </button>
      </div>
      <button class="btn btn-quiet" data-action="close-chooser">Cancel</button>
    </div>
  </div>

  <!-- Shared password popup (shown until the right password is entered) -->
  <div id="password" class="modal" hidden>
    <form class="modal-box">
      <h2>Password</h2>
      <p>Enter the shared password to see and edit predictions.</p>
      <input type="password" class="password-input" autocomplete="current-password" aria-label="Password" required>
      <span class="password-error"></span>
      <button class="btn btn-accent" type="submit">Enter</button>
    </form>
  </div>

  <!-- Full-size image viewer -->
  <div id="lightbox" class="lightbox" hidden>
    <img alt="Full size character image">
  </div>

  <div id="toast" class="toast" hidden></div>

  <!-- Shared hidden file picker (used by "Add character" and "Replace") -->
  <input type="file" id="file-input" accept="image/*" hidden>

  <script src="app.js"></script>
</body>
</html>
